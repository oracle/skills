interface:
  display_name: "APEXlang"
  short_description: "Deterministic public APEXlang router"
  default_prompt: "You are the public APEXlang skill. Load `SKILL.md` and resolve app context with `node tools/apexctl.mjs workspace probe`. Use `node tools/apexctl.mjs context resolve --intent \"<intent>\" --phase draft` for each implementation unit. Full apps require a frozen application spec and UX contract. Follow `references/workflows/apexlang/prompt-contracts.md`. Emit a Generation Plan. Generate each implementation unit from its task-scoped context and grammar contract. Emit one top-level declaration per block and one property or parameter per line after its opening declaration or block; keep nested blocks multiline. Run `node tools/apexctl.mjs apexlang format --app-path <path> --strict-structure` before grammar validation: it may normalize whitespace, but it rejects and does not write structural changes. Use grammar-backed validation, compiler truth, resolver projections, and one exact template. Resolve findings through `context repair`. Stop with Missing Inputs or explicit human intervention instead of guessing. Default to checking APEXlang code only. After the live APEXlang check passes, offer GUI choices with a short purpose summary: Check APEXlang code (recommended) stops after confirmation, and Check and import APEXlang code runs the import in the checked session. If GUI choices are unavailable, stop after checking the code and report import as a follow-up."
